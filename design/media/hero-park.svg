<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="560" viewBox="0 0 1920 560" role="img" aria-label="园区共建 · 企业共生 主视觉">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1b2a"/>
      <stop offset="0.46" stop-color="#123049"/>
      <stop offset="1" stop-color="#16505c"/>
    </linearGradient>
    <radialGradient id="glow3a" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#49b3a8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#49b3a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3b" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2ce8c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f2ce8c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blockA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6f83"/>
      <stop offset="1" stop-color="#16403f"/>
    </linearGradient>
    <linearGradient id="blockB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d7f8c"/>
      <stop offset="1" stop-color="#1b4a4f"/>
    </linearGradient>
    <pattern id="grid3" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#8fd8cf" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="windows3" width="15" height="21" patternUnits="userSpaceOnUse">
      <rect x="3" y="5" width="7" height="10" fill="#e8f6e9" fill-opacity="0.45"/>
    </pattern>
    <clipPath id="campus">
      <rect x="1084" y="292" width="104" height="268" rx="6"/>
      <rect x="1206" y="232" width="92" height="328" rx="6"/>
      <rect x="1316" y="326" width="150" height="234" rx="6"/>
      <rect x="1486" y="196" width="108" height="364" rx="6"/>
      <rect x="1612" y="302" width="126" height="258" rx="6"/>
      <rect x="1756" y="248" width="164" height="312" rx="6"/>
    </clipPath>
  </defs>

  <rect width="1920" height="560" fill="url(#bg3)"/>
  <rect width="1920" height="560" fill="url(#grid3)"/>
  <circle cx="1560" cy="190" r="340" fill="url(#glow3a)"/>
  <circle cx="1180" cy="480" r="290" fill="url(#glow3b)"/>

  <!-- 园区建筑群 -->
  <g>
    <rect x="1084" y="292" width="104" height="268" rx="6" fill="url(#blockA)"/>
    <rect x="1206" y="232" width="92" height="328" rx="6" fill="url(#blockB)"/>
    <rect x="1316" y="326" width="150" height="234" rx="6" fill="url(#blockA)"/>
    <rect x="1486" y="196" width="108" height="364" rx="6" fill="url(#blockB)"/>
    <rect x="1612" y="302" width="126" height="258" rx="6" fill="url(#blockA)"/>
    <rect x="1756" y="248" width="164" height="312" rx="6" fill="url(#blockB)"/>
  </g>
  <g clip-path="url(#campus)" opacity="0.36">
    <rect x="1060" y="180" width="900" height="400" fill="url(#windows3)"/>
  </g>
  <g fill="#a9e6d8" fill-opacity="0.3">
    <rect x="1084" y="292" width="3" height="268" rx="1.5"/>
    <rect x="1206" y="232" width="3" height="328" rx="1.5"/>
    <rect x="1316" y="326" width="3" height="234" rx="1.5"/>
    <rect x="1486" y="196" width="3" height="364" rx="1.5"/>
    <rect x="1612" y="302" width="3" height="258" rx="1.5"/>
    <rect x="1756" y="248" width="3" height="312" rx="1.5"/>
  </g>

  <!-- 园区绿化 -->
  <g>
    <g fill="#2f8f7d" fill-opacity="0.75">
      <circle cx="1052" cy="520" r="26"/>
      <circle cx="1104" cy="536" r="19"/>
    </g>
    <g fill="#49b3a8" fill-opacity="0.55">
      <circle cx="1440" cy="524" r="30"/>
      <circle cx="1494" cy="542" r="20"/>
      <circle cx="1290" cy="540" r="18"/>
    </g>
    <g fill="#1f6b63" fill-opacity="0.8">
      <rect x="1048" y="540" width="6" height="20"/>
      <rect x="1437" y="544" width="6" height="16"/>
    </g>
  </g>

  <!-- 企业共生连接 -->
  <g stroke="#7fd6c6" stroke-opacity="0.45" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M760 372 L960 300 L1150 352 L1340 268 L1560 322 L1740 262"/>
    <path d="M960 300 L1080 196 L1290 232"/>
    <path d="M1150 352 L1260 456 L1470 430"/>
  </g>
  <g fill="#a9e6d8">
    <circle cx="760" cy="372" r="4.5" fill-opacity="0.55"/>
    <circle cx="960" cy="300" r="6.5" fill-opacity="0.85"/>
    <circle cx="1080" cy="196" r="5" fill-opacity="0.6"/>
    <circle cx="1150" cy="352" r="6" fill-opacity="0.8"/>
    <circle cx="1260" cy="456" r="5" fill-opacity="0.6"/>
    <circle cx="1290" cy="232" r="5" fill-opacity="0.6"/>
    <circle cx="1340" cy="268" r="7" fill-opacity="0.9"/>
    <circle cx="1470" cy="430" r="5" fill-opacity="0.6"/>
    <circle cx="1560" cy="322" r="6" fill-opacity="0.75"/>
    <circle cx="1740" cy="262" r="5" fill-opacity="0.6"/>
  </g>
  <g fill="#f2ce8c">
    <circle cx="960" cy="300" r="2.6"/>
    <circle cx="1340" cy="268" r="2.6"/>
    <circle cx="1560" cy="322" r="2.4"/>
  </g>

  <rect x="0" y="548" width="1920" height="1.5" fill="#8fd8cf" fill-opacity="0.24"/>
</svg>
