<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="财税记账">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A2E2A"/>
      <stop offset="50%" stop-color="#0D5C55"/>
      <stop offset="100%" stop-color="#1A8A7A"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="560" cy="280" r="140" fill="#5EEAD4" fill-opacity="0.1"/>
  <circle cx="100" cy="80" r="70" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="480" y="30" width="100" height="60" rx="6" fill="#FFFFFF" fill-opacity="0.06"/>
  <!-- ledger bars -->
  <rect x="180" y="220" width="40" height="70" rx="4" fill="#99F6E4" fill-opacity="0.55"/>
  <rect x="240" y="180" width="40" height="110" rx="4" fill="#5EEAD4" fill-opacity="0.65"/>
  <rect x="300" y="140" width="40" height="150" rx="4" fill="#2DD4BF" fill-opacity="0.75"/>
  <rect x="360" y="100" width="40" height="190" rx="4" fill="#14B8A6" fill-opacity="0.85"/>
  <rect x="420" y="160" width="40" height="130" rx="4" fill="#99F6E4" fill-opacity="0.5"/>
  <!-- coin -->
  <circle cx="140" cy="160" r="36" fill="#F0FDFA" fill-opacity="0.2" stroke="#CCFBF1" stroke-width="2"/>
  <text x="140" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#ECFDF5">¥</text>
  <text x="48" y="318" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#FFFFFF" fill-opacity="0.92" letter-spacing="4">财税</text>
</svg>
